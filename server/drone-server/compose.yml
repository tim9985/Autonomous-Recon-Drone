name: drone-sandbox-20261003
x-app: &app
  image: drone-sandbox:20261003
  network_mode: host
  restart: unless-stopped
  user: "1001:1001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 12g
  cpus: 4
  shm_size: 1g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    STORAGE_ROOT: /data
    HOME: /home/sandbox
    JUPYTER_CONFIG_DIR: /home/sandbox/.jupyter
    DATABASE_URL: postgresql://drone:${DATABASE_PASSWORD}@127.0.0.1:18432/drone
  volumes:
    - ./workspace:/workspace
    - ./data:/data
services:
  database:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    network_mode: host
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      POSTGRES_DB: drone
      POSTGRES_USER: drone
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    command: [postgres, -p, "18432", -c, "listen_addresses=127.0.0.1", -c, "max_connections=30", -c, "shared_buffers=256MB"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-drone.sql:ro
      - ./secrets/db-password:/run/secrets/db-password:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 18432 -U drone -d drone"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    build:
      context: .
      network: host
    command: [uvicorn, app.main:app, --host, 127.0.0.1, --port, "18400"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:18400/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
  vision:
    <<: *app
    command: [python, -m, app.vision_worker]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/data/worker-status.json'); assert p.exists() and 0 <= time.time()-p.stat().st_mtime < 20"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
  jupyter:
    <<: *app
    command: [jupyter, lab, --config=/workspace/config/jupyter_config.py]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:18459/login"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./workspace:/workspace
      - ./data:/data
      - ./data:/workspace/data
      - ./secrets/jupyter-token:/run/secrets/jupyter-token:ro
      - ./data/jupyter-home:/home/sandbox
  media:
    image: bluenviron/mediamtx:1.21.1@sha256:5ce2a948eb68df06ce2e13870db8df8e30d516ac4dc40e04bfe8aee3bdf7be40
    network_mode: host
    restart: unless-stopped
    user: "1001:1001"
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./data:/data
