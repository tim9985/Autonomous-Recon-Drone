<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드론 지상 제어 시험</title>
<style>body{font:16px system-ui;background:#eef2f6;color:#172b40;max-width:850px;margin:35px auto;padding:15px}section{background:white;padding:24px;border-radius:12px;margin:16px 0}h1{font-size:26px}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:9px}button{background:#1b5c9c;color:white;border:0;border-radius:6px}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui}.note{color:#52657a}</style>
<h1>드론 지상 제어 시험</h1><p class="note">학교 서버 → 게이트웨이 → KOA FC · real-drone-01</p>
<section id="auth"><h2>운영자 로그인</h2><form id="login"><label>아이디 <input name="login_id" autocomplete="username" required></label><label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section>
<section><h2>드론 상태</h2><pre id="state">로그인 후 상태를 표시합니다.</pre><p class="note">시험 중에는 FC 연결을 시험 프로세스가 사용하므로 상태 갱신이 잠시 중단됩니다.</p></section>
<section id="control" hidden><h2>FC 명령 수신 확인</h2><p>비행제어기 버전을 조회하고 실제 응답을 확인합니다.</p><button id="query" disabled>FC 정보 조회</button><h2>모터 시험</h2><p>낮은 출력으로 동작하며 지정 시간이 지나면 FC에서 정지합니다.</p><form id="test"><label>대상 <select id="motor"><option value="0">네 모터 동시</option><option value="1">A 모터</option><option value="2">B 모터</option><option value="3">C 모터</option><option value="4">D 모터</option></select></label><label>시간(1~20초) <input id="seconds" type="number" min="1" max="20" value="20" required></label><label><input id="props" type="checkbox" required> 프로펠러 4개 분리·기체 고정 확인</label><label><input id="observer" type="checkbox" required> 현장 관찰 중이며 필요 시 전원을 분리할 수 있음</label><button id="start" disabled>모터 시험 실행</button></form></section>
<section><h2>시험 결과</h2><pre id="result">시험 대기</pre><p id="error" role="alert"></p></section>
<script>
let csrf='',pending=null,busy=false,live=false;
const $=id=>document.getElementById(id);
async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function enable(){$('start').disabled=busy||!live||!$('props').checked||!$('observer').checked;$('query').disabled=busy||!live}
async function refresh(){if(!csrf)return;try{let d=await api('/api/status'),x=d.live||{},s=x.sample||{};live=x.state==='LIVE'&&s.armed===false;let v=n=>n===null||n===undefined?'미수신':n;$('state').textContent=`연결: ${x.state||'대기'} · 수신 경과: ${Number(x.age_seconds||0).toFixed(1)}초\n무장: ${s.armed===undefined?'미수신':s.armed?'무장':'비무장'}\n배터리: ${v(s.battery_voltage_v)} V · ${v(s.battery_remaining_percent)} %\nGPS: ${v(s.gps_fix_type)} · 위성: ${v(s.satellites_visible)}\n상태 수신 시각: ${v(s.received_at)}`;if(pending){let j=await api('/api/jobs/'+pending);$('result').textContent=JSON.stringify(j,null,2);if(['COMPLETED','FAILED'].includes(j.state)){pending=null;busy=false}}enable()}catch(e){live=false;enable();$('error').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),d=await api('/api/login','POST',Object.fromEntries(f));csrf=d.csrf;$('auth').hidden=true;$('control').hidden=false;$('error').textContent='';await refresh()}catch(x){$('error').textContent=x.message}finally{e.target.elements.password.value=''}};
$('props').onchange=$('observer').onchange=enable;
$('query').onclick=async()=>{if(busy||!live)return;busy=true;enable();try{let d=await api('/api/fc-query','POST',{id:crypto.randomUUID()});pending=d.id;$('result').textContent='FC 응답 대기';$('error').textContent=''}catch(x){busy=false;$('error').textContent=x.message}enable()};
$('test').onsubmit=async e=>{e.preventDefault();if(busy||!live)return;busy=true;enable();let id=crypto.randomUUID();try{let d=await api('/api/motor-test','POST',{id,motor:Number($('motor').value),seconds:Number($('seconds').value),props_removed:$('props').checked,observer_ready:$('observer').checked});pending=d.id;$('result').textContent='명령 접수 · 실행 결과 대기';$('error').textContent=''}catch(x){busy=false;$('error').textContent=x.message}enable()};
setInterval(refresh,2000);
</script></html>
