services:
  regional-planner:
    image: drone-regional-planner:20261022
    pull_policy: never
    network_mode: none
    user: "2101:2101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 4g
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: [python, -m, server_integration.regional_search.worker, --queue, /queue, --packages, /packages]
    volumes:
      - ./regional-search-code/server_integration:/workspace/server_integration:ro
      - ./data/regional-search-packages:/packages:ro
      - ./data/backend/regional-search:/queue
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  regional-observer:
    image: drone-regional-planner:20261022
    pull_policy: never
    network_mode: none
    user: "2101:2101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 4g
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      NUMBA_CACHE_DIR: /queue/numba-cache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: [python, -m, server_integration.regional_search.observe, --queue, /queue, --packages, /packages]
    volumes:
      - ./regional-search-code/server_integration:/workspace/server_integration:ro
      - ./data/regional-search-packages:/packages:ro
      - ./data/backend/regional-search:/queue
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  regional-preview:
    image: drone-regional-planner:20261022
    pull_policy: never
    network_mode: none
    user: "2101:2101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 3g
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: [python, -m, server_integration.regional_search.preview, --queue, /queue, --packages, /packages]
    volumes:
      - ./regional-search-code/server_integration:/workspace/server_integration:ro
      - ./data/regional-search-packages:/packages:ro
      - ./data/backend/regional-search:/queue
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
