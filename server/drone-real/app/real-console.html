<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REAL 실기체 지상 시험</title>
  <link rel="stylesheet" href="/real-console.css">
  <script src="/real-console.js" defer></script>
  <script src="/real-live-map.js" defer></script>
</head>
<body>
  <main>
    <p class="label">REAL · 지상 시험</p>
    <h1>실기체 임무 전달 확인</h1><p><a href="/real-control.html">실기체 지상 제어·사람 탐지 임무 운용</a></p>
    <p>이 페이지의 전달 시험은 FC에 비행 명령을 보내지 않습니다. 실제 지상 제어·임무 실행은 위 운용 화면에서 제어권과 현장 상태를 확인한 후 요청합니다.</p>
    <form id="login">
      <h2>운용자 로그인</h2>
      <label>아이디 <input name="login_id" value="dev-operator" required autocomplete="username"></label>
      <label>비밀번호 <input name="password" type="password" required autocomplete="current-password"></label>
      <button>로그인</button>
    </form>
    <section id="console" hidden>
      <div class="toolbar"><h2>지상 전달 시험</h2><button id="logout" type="button">로그아웃</button></div>
      <p id="readiness"></p>
      <section id="live-map-panel" aria-label="실기체 실시간 지도" data-status="WAITING">
        <div class="live-map-heading"><h2>실기체 상태 지도</h2><span data-live-field="link" role="status">상태 수신 대기</span></div>
        <canvas role="img" aria-label="금오공과대학교 캠퍼스 지도"></canvas>
        <p data-live-field="map">금오공대 캠퍼스</p><p data-live-field="position">유효한 실시간 위치 대기 중</p>
        <dl class="live-map-metrics">
          <div><dt>FC 상태</dt><dd data-live-field="armed">—</dd></div>
          <div><dt>배터리</dt><dd data-live-field="battery">—</dd></div>
          <div><dt>GPS</dt><dd data-live-field="gps">—</dd></div>
          <div><dt>마지막 수신</dt><dd data-live-field="time">—</dd></div>
        </dl>
      </section>

      <form id="bench">
        <label>대상 기체 <select name="drone" required></select></label>
        <p id="gateway" aria-live="polite"></p>
        <fieldset>
          <legend>시험 경유점 한 개</legend>
          <label>위도 <input name="latitude" type="number" min="-90" max="90" step="any" required></label>
          <label>경도 <input name="longitude" type="number" min="-180" max="180" step="any" required></label>
          <label>홈 기준 상대고도 (m) <input name="altitude" type="number" min="0.1" max="120" step="any" required></label>
        </fieldset>
        <button id="submit" disabled>지상 전달 시험 시작</button>
      </form>
      <pre id="result" aria-live="polite"></pre>
    </section>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
