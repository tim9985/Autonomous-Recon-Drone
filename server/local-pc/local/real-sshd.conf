Port 7540
ListenAddress 127.0.0.1
HostKey /etc/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/drone-real-ssh/authorized_keys
AllowUsers drone-gw-tunnel
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
MaxSessions 0
AllowTcpForwarding local
PermitOpen 127.0.0.1:18443 127.0.0.1:19444 127.0.0.1:19560
AllowStreamLocalForwarding no
AllowAgentForwarding no
GatewayPorts no
X11Forwarding no
PermitTTY no
PermitTunnel no
LogLevel VERBOSE
